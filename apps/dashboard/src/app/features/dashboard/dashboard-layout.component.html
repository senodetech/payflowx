<div class="min-h-screen flex flex-col md:flex-row bg-slate-50">
  <!-- Sidebar -->
  <aside class="w-full md:w-64 bg-white border-r border-slate-200 flex flex-col">
    <!-- Logo Header -->
    <div class="h-16 px-6 border-b border-slate-200 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-sm">P</div>
        <span class="text-xl font-bold text-slate-800">PayFlow<span class="text-brand-600">X</span></span>
      </div>
      <span class="px-2 py-0.5 text-2xs font-bold bg-brand-50 text-brand-700 rounded-full border border-brand-200">Sandbox</span>
    </div>

    <!-- Sidebar Navigation -->
    <nav class="flex-1 p-4 space-y-6 overflow-y-auto">
      <!-- Group 1: Core Gateway -->
      <div class="space-y-1">
        <div class="px-3 text-2xs font-bold uppercase tracking-wider text-slate-400 mb-2">Core Platform</div>
        <a
          routerLink="overview"
          routerLinkActive="bg-brand-50 text-brand-600 font-semibold"
          class="flex items-center gap-3 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg transition-colors"
        >
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
          <span>Overview</span>
        </a>
        <a
          routerLink="payments"
          routerLinkActive="bg-brand-50 text-brand-600 font-semibold"
          class="flex items-center gap-3 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg transition-colors"
        >
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>
          <span>Payments</span>
        </a>
        <a
          routerLink="keys"
          routerLinkActive="bg-brand-50 text-brand-600 font-semibold"
          class="flex items-center gap-3 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg transition-colors"
        >
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
          <span>API Keys</span>
        </a>
        <a
          routerLink="webhooks"
          routerLinkActive="bg-brand-50 text-brand-600 font-semibold"
          class="flex items-center gap-3 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg transition-colors"
        >
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
          <span>Webhooks</span>
        </a>
      </div>

      <!-- Group 2: Administration -->
      <div class="space-y-1">
        <div class="px-3 text-2xs font-bold uppercase tracking-wider text-slate-400 mb-2">Administration</div>
        <a
          routerLink="admin"
          routerLinkActive="bg-purple-50 text-purple-700 font-semibold border-purple-200"
          class="flex items-center justify-between px-3 py-2 text-sm text-slate-600 hover:bg-purple-50/60 hover:text-purple-700 rounded-lg transition-colors"
        >
          <div class="flex items-center gap-3">
            <svg class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
            <span>Admin Console</span>
          </div>
          <span class="text-3xs bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded font-bold uppercase">Staff</span>
        </a>
      </div>

      <!-- Group 3: Documentation & Manuals -->
      <div class="space-y-1">
        <div class="px-3 text-2xs font-bold uppercase tracking-wider text-slate-400 mb-2">Documentation</div>
        <a
          routerLink="dev-docs"
          routerLinkActive="bg-brand-50 text-brand-600 font-semibold"
          class="flex items-center gap-3 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg transition-colors"
        >
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" /></svg>
          <span>Developer Docs</span>
        </a>
        <a
          routerLink="platform-guide"
          routerLinkActive="bg-brand-50 text-brand-600 font-semibold"
          class="flex items-center gap-3 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg transition-colors"
        >
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
          <span>How to Use Guide</span>
        </a>
      </div>
    </nav>

    <!-- Sidebar Footer / Logout -->
    <div class="p-4 border-t border-slate-200 bg-slate-50/50">
      <div class="mb-3 px-2 flex items-center justify-between text-2xs font-semibold text-slate-500">
        <span class="uppercase tracking-wider">Role</span>
        <span class="bg-slate-200/80 text-slate-700 px-2 py-0.5 rounded font-mono text-3xs uppercase">
          {{ store.user()?.role || 'MERCHANT_OWNER' }}
        </span>
      </div>
      <button
        (click)="onLogout()"
        class="w-full flex items-center justify-center px-4 py-2 text-red-600 hover:bg-red-50 font-semibold rounded-lg text-sm transition-colors border border-transparent hover:border-red-100"
      >
        Sign Out
      </button>
    </div>
  </aside>

  <!-- Main Layout Body -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Main Navbar Header -->
    <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between">
      <div class="text-sm font-medium text-slate-500">
        Account: <span class="font-bold text-slate-800">{{ store.user()?.email || 'senacme@sascad.com' }}</span>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full text-xs font-semibold border border-emerald-200">
          <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Gateway Live</span>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-8 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
