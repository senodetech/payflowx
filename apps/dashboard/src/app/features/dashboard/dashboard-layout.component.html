<div class="min-h-screen flex flex-col md:flex-row bg-slate-50">
  <!-- Sidebar -->
  <aside class="w-full md:w-64 bg-white border-r border-slate-200 flex flex-col">
    <!-- Logo Header -->
    <div class="h-16 px-6 border-b border-slate-200 flex items-center justify-between">
      <span class="text-xl font-bold text-brand-600">PayFlowX</span>
      <span class="px-2 py-0.5 text-xs font-semibold bg-brand-50 text-brand-600 rounded">Sandbox</span>
    </div>

    <!-- Sidebar Navigation -->
    <nav class="flex-1 p-4 space-y-1">
      <a
        routerLink="overview"
        routerLinkActive="bg-brand-50 text-brand-600 font-semibold"
        class="flex items-center px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg transition-colors"
      >
        <span>Overview</span>
      </a>
      <a
        routerLink="payments"
        routerLinkActive="bg-brand-50 text-brand-600 font-semibold"
        class="flex items-center px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg transition-colors"
      >
        <span>Payments</span>
      </a>
      <a
        routerLink="keys"
        routerLinkActive="bg-brand-50 text-brand-600 font-semibold"
        class="flex items-center px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg transition-colors"
      >
        <span>API Keys</span>
      </a>
      <a
        routerLink="webhooks"
        routerLinkActive="bg-brand-50 text-brand-600 font-semibold"
        class="flex items-center px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg transition-colors"
      >
        <span>Webhooks</span>
      </a>
    </nav>

    <!-- Sidebar Footer / Logout -->
    <div class="p-4 border-t border-slate-200 bg-slate-50/50">
      <div class="mb-4 px-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">
        User Role: {{ store.user()?.role || 'Merchant' }}
      </div>
      <button
        (click)="onLogout()"
        class="w-full flex items-center justify-center px-4 py-2.5 text-red-600 hover:bg-red-50 font-semibold rounded-lg transition-colors border border-transparent hover:border-red-100"
      >
        Sign Out
      </button>
    </div>
  </aside>

  <!-- Main Layout Body -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Main Navbar Header -->
    <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between">
      <div class="text-sm font-semibold text-slate-500">
        Account: <span class="text-slate-800">{{ store.user()?.email || 'Active Session' }}</span>
      </div>
      <div class="flex items-center gap-4">
        <span class="h-2 w-2 rounded-full bg-green-500"></span>
        <span class="text-xs font-semibold text-slate-500">Gateway Connected</span>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-8 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
